# Render Blueprint: one always-on Node web service (Next.js + Express API + Socket.IO)
services:
  - type: web
    name: speed-taxi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false            # paste your Atlas connection string in the dashboard
      - key: MONGO_DB
        value: uber
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false            # https://<your-service>.onrender.com
